name: Scheduled Task

on:
  schedule:
    # Chạy mỗi ngày lúc 15:00 giờ Việt Nam.
    # GitHub Actions dùng UTC, Việt Nam UTC+7 nên 15:00 VN = 08:00 UTC.
    - cron: "0 8 * * *"

  # Cho phép bấm Run workflow để test thủ công khi cần.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-task:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run script
        run: python main.py

      - name: Upload CSV artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stock-csv-files
          path: data/stock_*.csv
          if-no-files-found: error
          retention-days: 30

      - name: Commit CSV outputs to repo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/*.csv
          git commit -m "Add stock CSV output" || echo "No changes to commit"
          git push
