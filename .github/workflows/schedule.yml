name: Scheduled Task

on:
  schedule:
    # Chạy mỗi ngày lúc 07:00 sáng giờ Việt Nam
    # GitHub dùng UTC, Việt Nam UTC+7 nên 07:00 VN = 00:00 UTC
    - cron: "0 0 * * *"

  # Cho phép bấm Run workflow để test thủ công
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-task:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run script
        run: python main.py

      - name: Upload CSV artifact
        uses: actions/upload-artifact@v4
        with:
          name: Data_500_stocks_2026
          path: data/output/Data_500_stocks_2026.csv
          if-no-files-found: error
          retention-days: 30

      - name: Commit CSV output to repo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/output/Data_500_stocks_2026.csv
          git commit -m "Update stock CSV output" || echo "No changes to commit"
          git push
